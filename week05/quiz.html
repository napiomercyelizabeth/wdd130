<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>

            <div class="quiz-item">
                <label for="q1">1. What does CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="quiz-item">
                <label for="q2">2. Explain the difference between padding and margin in CSS:</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>


            <div class="quiz-item">
                <label for="q3">3. Which HTML element is used to define an unordered list?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="ol">&lt;ol&gt;</option>
                    <option value="ul">&lt;ul&gt;</option>
                    <option value="li">&lt;li&gt;</option>
                </select>
            </div>

            <div class="quiz-item">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <pre class="code-box">margin: 10px 5px 15px;</pre>
                <input type="number" id="q4" name="q4" required>
            </div>


            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>&copy;2026 | HTML and CSS Quiz Activity</p>
    </footer>

</body>

</html>
